[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alyssa-code-review-risk-api"
version = "1.0.0"
description = "Public portfolio API for deterministic code-change risk analysis."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.7,<3", "uvicorn[standard]>=0.30,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "pytest-cov>=5,<6"]

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
